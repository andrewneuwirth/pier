<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B4A6B"/>
      <stop offset="1" stop-color="#151A28"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <!-- squircle-ish tile on Apple's 1024 grid (824 content, 100 margin) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <!-- menu bar strip -->
  <rect x="100" y="100" width="824" height="150" fill="#FFFFFF" fill-opacity="0.08" clip-path="url(#tile)"/>
  <!-- tucked icons fading off to the left -->
  <circle cx="230" cy="175" r="22" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="310" cy="175" r="22" fill="#FFFFFF" fill-opacity="0.22"/>
  <circle cx="390" cy="175" r="22" fill="#FFFFFF" fill-opacity="0.34"/>
  <!-- the glass list dropping down -->
  <rect x="300" y="300" width="424" height="520" rx="70" fill="url(#glass)"
        stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4"/>
  <g fill="#FFFFFF">
    <rect x="350" y="370" width="56" height="56" rx="16" fill-opacity="0.9"/>
    <rect x="430" y="384" width="230" height="28" rx="14" fill-opacity="0.75"/>
    <rect x="350" y="470" width="56" height="56" rx="16" fill-opacity="0.7"/>
    <rect x="430" y="484" width="190" height="28" rx="14" fill-opacity="0.55"/>
    <rect x="350" y="570" width="56" height="56" rx="16" fill-opacity="0.5"/>
    <rect x="430" y="584" width="210" height="28" rx="14" fill-opacity="0.4"/>
    <rect x="350" y="670" width="56" height="56" rx="16" fill-opacity="0.32"/>
    <rect x="430" y="684" width="150" height="28" rx="14" fill-opacity="0.26"/>
  </g>
  <!-- the one button: ⋯ -->
  <g fill="#FFFFFF">
    <circle cx="732" cy="175" r="16"/>
    <circle cx="782" cy="175" r="16"/>
    <circle cx="832" cy="175" r="16"/>
  </g>
</svg>
