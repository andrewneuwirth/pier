name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-26   # Pier targets macOS 26, so its self-check binary only runs there
    steps:
      # Pier builds against a Kit checkout next to it when there is one (see Package.swift).
      - uses: actions/checkout@v4
        with: { path: Pier }
      - uses: actions/checkout@v4
        with: { repository: andrewneuwirth/mac-tools-kit, path: Kit }
      # Package.swift needs Swift 6.2 tools, which ship with Xcode 26; the runner's default may be older.
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: cd Pier && swift build && .build/debug/Pier --self-check
