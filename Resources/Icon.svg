<?xml version="1.0" encoding="UTF-8"?>
<!-- Source of truth for the app icon. Rasterised into UsageRings.icns by
     Tools/makeicon.sh. Two rings at different fills, linked the way the pair
     sits on the desktop. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4A3459"/>
      <stop offset="0.5" stop-color="#2A1E36"/>
      <stop offset="1" stop-color="#150F1D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#B98FDD" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#B98FDD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.015"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Keeps a clean gap where the right ring crosses the left one, instead
         of stacking an opaque disc on top of it. -->
    <mask id="linkGap">
      <rect x="0" y="0" width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="616" cy="506" r="205" fill="#000000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#plate)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#glow)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#sheen)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="228"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="10"/>

  <!-- Claude, three-quarters around, interrupted where ChatGPT crosses it. -->
  <g mask="url(#linkGap)">
    <circle cx="408" cy="506" r="165" fill="none"
            stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="44"/>
    <circle cx="408" cy="506" r="165" fill="none" stroke="#D97757"
            stroke-width="44" stroke-linecap="round"
            stroke-dasharray="778 1037" transform="rotate(-90 408 506)"/>
  </g>

  <!-- ChatGPT, a shorter arc, laid over the gap. -->
  <circle cx="616" cy="506" r="165" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="44"/>
  <circle cx="616" cy="506" r="165" fill="none" stroke="#10A37F"
          stroke-width="44" stroke-linecap="round"
          stroke-dasharray="415 1037" transform="rotate(-90 616 506)"/>
</svg>
