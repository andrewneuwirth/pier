name: UsageRings
options:
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: TEAMID
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  UsageRings:
    type: application
    platform: macOS
    sources:
      - Sources/UsageRings
      - Shared
      - path: Resources/UsageRings.icns
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: UsageRings
        PRODUCT_BUNDLE_IDENTIFIER: com.example.UsageRings
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/UsageRings.entitlements
        ENABLE_HARDENED_RUNTIME: NO
    dependencies:
      - target: UsageRingsWidget
        embed: true
  UsageRingsWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_NAME: UsageRingsWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.example.UsageRings.Widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        SKIP_INSTALL: YES
